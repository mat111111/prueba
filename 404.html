<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>404 · Page not found</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/theme-init.js"></script>
</head>
<body>
  <main class="section">
    <div class="container">
      <div class="terminal">
        <div class="terminal-bar" aria-hidden="true">
          <span class="tdot"></span><span class="tdot"></span><span class="tdot"></span>
          <span class="terminal-title">~/404</span>
        </div>
<pre class="terminal-body"><span class="t-prompt">$</span> cd this-page
<span class="t-out">bash: cd: this-page: No such file or directory</span>

<span class="t-prompt">$</span> cd ~ <span class="t-ok"># back home ↓</span></pre>
      </div>
      <p class="cta-row"><a class="btn btn-primary" href="./">Go to the homepage</a></p>
    </div>
  </main>
</body>
</html>
